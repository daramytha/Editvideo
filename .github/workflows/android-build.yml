name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual dari tab Actions di GitHub

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repositori GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup JDK (Java) versi 17 (Wajib untuk Android Gradle Plugin modern)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Memberikan izin eksekusi pada file gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Menjalankan Gradle untuk membangun APK (Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. Mengunggah (Upload) file APK agar bisa diunduh dari GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditorApp-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
