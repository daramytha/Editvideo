name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 1. Beri izin eksekusi pada file gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. Jalankan build dengan mekanisme Retry (Coba ulang hingga 3 kali)
      - name: Build Debug APK (with Retry)
        run: |
          for i in 1 2 3; do
            echo "Mencoba build (Percobaan $i)..."
            if ./gradlew assembleDebug --stacktrace; then
              echo "Build berhasil!"
              exit 0
            fi
            echo "Build gagal, menunggu 15 detik sebelum mencoba lagi..."
            sleep 15
          done
          echo "Build gagal setelah 3 percobaan."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditorApp-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
